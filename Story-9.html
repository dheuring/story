                localStorage.setItem(MODE_KEY, mode);
                applyModeUI(mode);

                if (mode === 'quiet') {
                    if (!audio.paused) audio.pause();
                    if (userInitiated) {
                        // This click is a real user gesture, so autoplay is reliably allowed here
                        bgMusic.play().catch(() => {});
                    }
                } else {
                    if (!bgMusic.paused) bgMusic.pause();
                }
                updateMusicButton();
            };

            window.toggleBgMusic = function () {
                if (bgMusic.paused) {
                    bgMusic.play().catch(() => {});
                } else {
                    bgMusic.pause();
                }
                updateMusicButton();
            };

            const savedMode = localStorage.getItem(MODE_KEY) || 'narrated';
            // Apply saved mode on load without forcing autoplay (page load isn't a user gesture)
            setMode(savedMode, false);
            if (savedMode === 'quiet') {
                // Best-effort: some browsers allow this if the domain has enough prior engagement
                bgMusic.play().catch(() => {});
                updateMusicButton();
            }
        })();
    </script>
</body>
</html>
