        // State — auto-scroll ON by default
        let autoScroll = true;
        let hasStarted = false;
        let currentParagraph = -1;
        let paragraphs = [];

        const audio = document.getElementById('narration');
        const progressBar = document.getElementById('progressBar');
        const progressBarContainer = document.getElementById('progressBarContainer');
        const playBtn = document.getElementById('playBtn');
        const autoScrollBtn = document.getElementById('autoScrollBtn');
        const currentTimeDisplay = document.getElementById('currentTimeDisplay');
        const durationDisplay = document.getElementById('durationDisplay');

        function formatTime(seconds) {
            if (!isFinite(seconds) || seconds < 0) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ':' + String(s).padStart(2, '0');
        }

        function renderProgressTicks() {
            if (!audio.duration || !isFinite(audio.duration)) return;
            progressBarContainer.querySelectorAll('.progress-tick').forEach(t => t.remove());
            storyText.forEach((text, index) => {
                if (text.startsWith('<img') && timestamps[index] !== undefined) {
                    const pct = (timestamps[index] / audio.duration) * 100;
                    const tick = document.createElement('div');
                    tick.className = 'progress-tick';
                    tick.style.left = pct + '%';
                    tick.title = 'Image';
                    progressBarContainer.appendChild(tick);
                }
            });
        }

        audio.addEventListener('loadedmetadata', () => {
            durationDisplay.textContent = formatTime(audio.duration);
            renderProgressTicks();
        });

        function init() {
            const container = document.getElementById('storyContent');
            storyText.forEach((text, index) => {
                const p = document.createElement('p');
                p.className = 'paragraph upcoming';
                p.setAttribute('data-index', index);
                if (text.startsWith('<img')) {
                    p.innerHTML = text;
                    p.classList.add('image-entry');
                    p.style.textAlign = 'center';
                    p.style.cursor = 'default';
                } else {
                    p.textContent = text;
                    p.addEventListener('click', () => seekToParagraph(index));
                }
                container.appendChild(p);
                paragraphs.push(p);
            });
            // Update auto-scroll button to reflect default ON state
            autoScrollBtn.textContent = 'Auto-Scroll: ON';
        }

        function handlePlayBtn() {
            if (audio.paused) {
                // First play: scroll to story text
                if (!hasStarted) {
                    hasStarted = true;
                    document.getElementById('storyContent').scrollIntoView({ behavior: 'smooth', block: 'start' });
                    setTimeout(() => audio.play(), 400);
                } else {
                    audio.play();
                }
            } else {
                audio.pause();
            }
        }

        audio.addEventListener('play', () => {
            playBtn.textContent = '⏸ Pause';
            playBtn.classList.add('playing');
        });

        audio.addEventListener('pause', () => {
            playBtn.textContent = '▶ Play Story';
            playBtn.classList.remove('playing');
        });

        audio.addEventListener('ended', () => {
            playBtn.textContent = '↺ Play Again';
            playBtn.classList.remove('playing');
        });

        document.getElementById('progressBarContainer').addEventListener('click', function(e) {
            const rect = this.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pos * audio.duration;
        });

        // Minimum real-time (ms since epoch) to hold on the current paragraph.
        // Used to guarantee images stay on screen for at least IMAGE_HOLD_MS,
        // even if the audio's built-in silence is slightly shorter than expected.
        const IMAGE_HOLD_MS = 10000;
        let holdUntilTime = 0;

        function onTimeUpdate() {
            const progress = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = progress + '%';
            currentTimeDisplay.textContent = formatTime(audio.currentTime);

            // Still holding on an image — skip advancing the highlight/scroll.
            if (Date.now() < holdUntilTime) {
                return;
            }

            let newIndex = -1;
            for (let i = 0; i < timestamps.length; i++) {
                if (audio.currentTime >= timestamps[i]) {
                    newIndex = i;
                } else {
                    break;
                }
            }

            if (newIndex !== currentParagraph) {
                currentParagraph = newIndex;
                highlightParagraph(newIndex);

                if (paragraphs[newIndex] && paragraphs[newIndex].classList.contains('image-entry')) {
                    holdUntilTime = Date.now() + IMAGE_HOLD_MS;
                }
            }
        }

        audio.addEventListener('timeupdate', onTimeUpdate);

        function highlightParagraph(index) {
            paragraphs.forEach((p, i) => {
                p.classList.remove('active', 'read', 'upcoming');
                if (i === index) {
                    p.classList.add('active');
                    if (autoScroll) {
                        p.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                } else if (i < index) {
                    p.classList.add('read');
                } else {
                    p.classList.add('upcoming');
                }
            });
        }

        function seekToParagraph(index) {
            if (window.currentReadMode === 'quiet') return;
            if (index >= 0 && index < timestamps.length) {
                holdUntilTime = 0;
                audio.currentTime = timestamps[index];
                audio.play();
            }
        }

        function previousParagraph() {
            const newIndex = Math.max(0, currentParagraph - 1);
            seekToParagraph(newIndex);
        }

        function nextParagraph() {
            const newIndex = Math.min(timestamps.length - 1, currentParagraph + 1);
            seekToParagraph(newIndex);
        }

        function toggleAutoScroll() {
            autoScroll = !autoScroll;
            autoScrollBtn.textContent = autoScroll ? 'Auto-Scroll: ON' : 'Auto-Scroll: OFF';
            autoScrollBtn.style.background = autoScroll
                ? 'linear-gradient(135deg, #718096 0%, #4a5568 100%)'
                : 'linear-gradient(135deg, #e53e3e 0%, #c53030 100%)';
        }

        document.addEventListener('keydown', function(e) {
            if (window.currentReadMode === 'quiet') return;
            if (e.code === 'Space' && e.target.tagName !== 'BUTTON') {
                e.preventDefault();
                handlePlayBtn();
            } else if (e.code === 'ArrowRight') {
                skip(10);
            } else if (e.code === 'ArrowLeft') {
                skip(-10);
            } else if (e.code === 'ArrowUp') {
                e.preventDefault();
                previousParagraph();
            } else if (e.code === 'ArrowDown') {
                e.preventDefault();
                nextParagraph();
            }
        });

        function skip(seconds) {
            audio.currentTime += seconds;
        }

        init();

        // Mobile drawer controls
        function toggleMobileDrawer() {
            const drawer = document.getElementById('mobileDrawer');
            const overlay = document.getElementById('mobileOverlay');
            const isOpen = drawer.classList.contains('open');
            if (isOpen) {
                closeMobileDrawer();
            } else {
                drawer.classList.add('open');
                overlay.classList.add('open');
                document.getElementById('mobileFab').textContent = '✕';
            }
        }

        function closeMobileDrawer() {
            document.getElementById('mobileDrawer').classList.remove('open');
            document.getElementById('mobileOverlay').classList.remove('open');
            document.getElementById('mobileFab').textContent = '☰';
        }

        function updateDrawerStatus() {
            // Keep drawer auto-scroll button in sync
            const drawerBtn = document.getElementById('drawerAutoScrollBtn');
            if (drawerBtn) {
                drawerBtn.textContent = autoScroll ? 'Auto-Scroll: ON' : 'Auto-Scroll: OFF';
                drawerBtn.style.background = autoScroll
                    ? 'linear-gradient(135deg, #718096 0%, #4a5568 100%)'
                    : 'linear-gradient(135deg, #e53e3e 0%, #c53030 100%)';
            }
        }

        // Keep drawer play button in sync with audio state
        audio.addEventListener('play', () => {
            const btn = document.getElementById('drawerPlayBtn');
            if (btn) { btn.textContent = '⏸ Pause'; btn.style.background = 'linear-gradient(135deg, #7c2d42 0%, #5a1f30 100%)'; }
            document.getElementById('drawerStatus').textContent = '▶️ Playing';
        });
        audio.addEventListener('pause', () => {
            const btn = document.getElementById('drawerPlayBtn');
            if (btn) { btn.textContent = '▶ Play Story'; btn.style.background = ''; }
            document.getElementById('drawerStatus').textContent = '⏸️ Paused';
        });
        audio.addEventListener('ended', () => {
            const btn = document.getElementById('drawerPlayBtn');
            if (btn) { btn.textContent = '↺ Play Again'; btn.style.background = ''; }
            document.getElementById('drawerStatus').textContent = '✅ Finished';
        });

        // ===== Reading mode: Narrated vs Quiet Reading =====
        (function () {
            const bgMusic = document.getElementById('bgMusic');
            const topControlsEl = document.getElementById('topControls');
            const quietControlsEl = document.getElementById('quietControls');
            const audioSectionEl = document.getElementById('audioSection');
            const musicMuteBtn = document.getElementById('musicMuteBtn');
            const drawerNarratedControlsEl = document.getElementById('drawerNarratedControls');
            const drawerQuietControlsEl = document.getElementById('drawerQuietControls');
            const drawerMusicMuteBtn = document.getElementById('drawerMusicMuteBtn');
            const MODE_KEY = 'heuring_read_mode';

            bgMusic.volume = 0.35; // adjust to taste, 0.0–1.0

            function applyModeUI(mode) {
                const isQuiet = mode === 'quiet';

                // Desktop panel
                topControlsEl.classList.toggle('quiet-hide', isQuiet);
                audioSectionEl.classList.toggle('quiet-hide', isQuiet);
                quietControlsEl.classList.toggle('show-panel', isQuiet);
                quietControlsEl.style.display = isQuiet ? 'flex' : 'none';

                // Mobile drawer panel (FAB itself always stays visible/reachable)
                drawerNarratedControlsEl.style.display = isQuiet ? 'none' : 'flex';
                drawerQuietControlsEl.style.display = isQuiet ? 'flex' : 'none';
            }

            function updateMusicButton() {
                const label = bgMusic.paused ? '🔇 Play Music' : '🔊 Pause Music';
                musicMuteBtn.textContent = label;
                drawerMusicMuteBtn.textContent = label;
            }

            window.setMode = function (mode, userInitiated) {
                window.currentReadMode = mode;
                localStorage.setItem(MODE_KEY, mode);
                applyModeUI(mode);

                if (mode === 'quiet') {
                    if (!audio.paused) audio.pause();
                    if (userInitiated) {
                        // This click is a real user gesture, so autoplay is reliably allowed here
                        bgMusic.play().catch(() => {});
                    }
                } else {
                    if (!bgMusic.paused) bgMusic.pause();
                }
                updateMusicButton();
            };

            window.toggleBgMusic = function () {
                if (bgMusic.paused) {
                    bgMusic.play().catch(() => {});
                } else {
                    bgMusic.pause();
                }
                updateMusicButton();
            };

            const savedMode = localStorage.getItem(MODE_KEY) || 'narrated';
            // Apply saved mode on load without forcing autoplay (page load isn't a user gesture)
            setMode(savedMode, false);
            if (savedMode === 'quiet') {
                // Best-effort: some browsers allow this if the domain has enough prior engagement
                bgMusic.play().catch(() => {});
                updateMusicButton();
            }
        })();
    </script>
