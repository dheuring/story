        // State — auto-scroll ON by default
        let autoScroll = true;
        let hasStarted = false;
        let currentParagraph = -1;

        const playBtn = document.getElementById('playBtn');

        const durationDisplay = document.getElementById('durationDisplay');

        function formatTime(seconds) {
            if (!isFinite(seconds) || seconds < 0) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ':' + String(s).padStart(2, '0');
        }

        function renderProgressTicks() {
            if (!audio.duration || !isFinite(audio.duration)) return;
            progressBarContainer.querySelectorAll('.progress-tick').forEach(t => t.remove());
            storyText.forEach((text, index) => {
                if (text.startsWith('<img') && timestamps[index] !== undefined) {
                    const pct = (timestamps[index] / audio.duration) * 100;
                    const tick = document.createElement('div');
                    tick.className = 'progress-tick';
                    tick.style.left = pct + '%';
                    tick.title = 'Image';
                    progressBarContainer.appendChild(tick);
                }
            });
        }

        audio.addEventListener('loadedmetadata', () => {
            durationDisplay.textContent = formatTime(audio.duration);
            renderProgressTicks();
        });

        function init() {
            const container = document.getElementById('storyContent');
            storyText.forEach((text, index) => {
                const p = document.createElement('p');
                p.className = 'paragraph upcoming';
                p.setAttribute('data-index', index);
                if (text.startsWith('<img')) {
                    p.innerHTML = text;
                    p.classList.add('image-entry');
                    p.style.textAlign = 'center';
                    p.style.cursor = 'default';
                } else {
                    p.textContent = text;
                    p.addEventListener('click', () => seekToParagraph(index));
                }
                container.appendChild(p);
                paragraphs.push(p);
            });
            // Update auto-scroll button to reflect default ON state
            autoScrollBtn.textContent = 'Auto-Scroll: ON';
        }

        function handlePlayBtn() {
            if (audio.paused) {
                // First play: scroll to story text
                if (!hasStarted) {
                    hasStarted = true;
                    document.getElementById('storyContent').scrollIntoView({ behavior: 'smooth', block: 'start' });
                    setTimeout(() => audio.play(), 400);
                } else {
                    audio.play();
                }
            } else {
                audio.pause();
            }
        }

        audio.addEventListener('play', () => {
            playBtn.textContent = '⏸ Pause';
            playBtn.classList.add('playing');
        });

        audio.addEventListener('pause', () => {
            playBtn.textContent = '▶ Play Story';
            playBtn.classList.remove('playing');
        });

        audio.addEventListener('ended', () => {
            playBtn.textContent = '↺ Play Again';
            playBtn.classList.remove('playing');
        });

        document.getElementById('progressBarContainer').addEventListener('click', function(e) {
            const rect = this.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;

        function onTimeUpdate() {
            const progress = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = progress + '%';
            currentTimeDisplay.textContent = formatTime(audio.currentTime);

                return;
            }

            for (let i = 0; i < timestamps.length; i++) {
